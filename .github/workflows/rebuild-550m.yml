name: Rebuild 550M notebook
on:
  workflow_dispatch:
jobs:
  rebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/rebuild_550m.py
      - name: Commit rebuilt files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notebooks/train_500m_colab.ipynb transformer/tokenizer_bpe.py
          if git diff --cached --quiet; then echo "no changes"; else git commit -m "Rebuild 550M notebook + tokenizer_bpe (pinned sources + self-heal patches)"; git push; fi
